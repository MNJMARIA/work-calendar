# Автоматична збірка й випуск оновлення.
# Коли ти робиш push у гілку main:
#   1) запускаються тести;
#   2) збирається підписаний APK;
#   3) створюється Release на GitHub (його бачить додаток);
#   4) усім користувачам надсилається сповіщення «Доступне оновлення».
# Усе відбувається на серверах GitHub, ноутбук може бути вимкнений.

name: Випуск оновлення

on:
  push:
    branches: [main]
    # Зміни лише в описах не випускають нову версію.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'firestore.rules'

permissions:
  contents: write

# Два пуші поспіль збираються по черзі, а не одночасно.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Завантажити код
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Залежності
        run: flutter pub get

      - name: Тести
        run: flutter test

      - name: Файли для підпису та Firebase (з секретів GitHub)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          echo "$GOOGLE_SERVICES_BASE64" | base64 -d > android/app/google-services.json
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Зібрати APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Підготувати файл і контрольну суму
        id: apk
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk work-calendar.apk
          SHA=$(sha256sum work-calendar.apk | cut -d' ' -f1)
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Створити Release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.apk.outputs.sha }}
          VERSION: ${{ steps.apk.outputs.version }}
          BUILD: ${{ github.run_number }}
        run: |
          # Текст коміту стає описом «Що нового». Береться з git, а не підставляється в команду.
          git log -1 --pretty=%B > notes.txt
          printf '\nSHA-256: %s\n' "$SHA" >> notes.txt
          gh release create "b$BUILD" work-calendar.apk \
            --title "Версія $VERSION ($BUILD)" \
            --notes-file notes.txt \
            --target "$GITHUB_SHA"

      - name: Надіслати сповіщення користувачам
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VERSION: ${{ steps.apk.outputs.version }}
          BUILD: ${{ github.run_number }}
        run: |
          pip install --quiet google-auth requests
          python .github/scripts/notify.py "$VERSION" "$BUILD"